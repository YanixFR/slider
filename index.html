<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design-Project</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="reset.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
      <section class="projects">
        <div class="container">
          <div class="projects-wrapper">
            <div class="projects-content">
              <h2 class="projects__subtitle">Completed<br />projects</h2>
              <p class="projects__text">
                Only a small part of the work performed by our company is
                presented on the site. For 14 years on in the construction
                market we have made happy more than 1000 families
              </p>
              <div class="projects-description">
                <div class="city">
                  <h4 class="projects-description__subtitle">City:</h4>
                </div>
                <div class="area">
                  <h4 class="projects-description__subtitle">
                    apartment area:
                  </h4>
                </div>
                <div class="time">
                  <h4 class="projects-description__subtitle">Repair time:</h4>
                </div>
                <div class="cost">
                  <h4 class="projects-description__subtitle">Repair Cost:</h4>
                </div>
              </div>
              <div class="projects-description__icon">
                <div class="projects__arrow back-arrow">
                  <img src="img/icon/Group1.png" alt="back arrow" />
                </div>
                <div class="projects__dot"></div>
                <div class="projects__arrow forward-arrow">
                  <img src="img/icon/Group2.png" alt="forward arrow" />
                </div>
              </div>
            </div>
            <div class="projects-photo">
              <div class="projects__list"></div>
              <div class="projects-photo__slaider"></div>
            </div>
          </div>
        </div>
      </section>      
      
      <script src="file.js"></script>
  </body>
</html>
